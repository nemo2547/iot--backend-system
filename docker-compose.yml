version: '3.8'

services:
  # 1. Database
  postgres:
    image: postgres:15-alpine
    container_name: iot-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: iot_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  # 2. In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: iot-redis
    ports:
      - "6379:6379"
    restart: always

# 3. Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: iot-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    # เพิ่ม Healthcheck ตรวจสอบว่า RabbitMQ พร้อมรับสายหรือยัง
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 4. Main API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-api
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy # รอให้ RabbitMQ พร้อมใช้งานจริงๆ
    restart: always

  # 5. Background Worker Service
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: iot-worker
    environment:
      DATABASE_URL: "postgresql://user:password@postgres:5432/iot_db?schema=public"
      RABBITMQ_URL: "amqp://rabbitmq:5672"
    depends_on:
      - rabbitmq
      - postgres
    restart: always

volumes:
  pgdata: